<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passport và Credit Card</title>
  <link rel="stylesheet" href="Styles/style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="Scripts/main.js" defer></script>
</head>
<body>
  <div class="card"><h1>Câu 12 - Thông tin bổ sung</h1><fieldset><legend>Passport</legend><label><input type="radio" name="passport" value="yes"> Yes</label> <label><input type="radio" name="passport" value="no" checked> No</label><div id="passportBox" class="conditional"><label>Số Passport</label><input type="text" id="passportNumber" placeholder="Nhập số passport"></div></fieldset><fieldset><legend>Credit Card</legend><label><input type="radio" name="credit" value="yes"> Yes</label> <label><input type="radio" name="credit" value="no" checked> No</label><div id="creditBox" class="conditional"><label>Thông tin thẻ</label><input type="text" id="creditNumber" placeholder="Nhập thông tin thẻ"></div></fieldset></div>
</body>
</html>
